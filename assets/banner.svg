<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alan, Desenvolvedor Back-end" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .in1 { animation: up 0.8s ease-out 0.2s backwards; }
    .in2 { animation: up 0.8s ease-out 0.5s backwards; }
    .in3 { animation: up 0.8s ease-out 0.8s backwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.7"/>

    <g filter="url(#blur)">
      <circle cx="940" cy="70" r="120" fill="#58a6ff" opacity="0.35">
        <animate attributeName="cx" values="940;1010;940" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;110;70" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="260" r="110" fill="#a371f7" opacity="0.3">
        <animate attributeName="cx" values="1090;1030;1090" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;220;260" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

    <g class="in1">
      <text x="64" y="86" class="mono" font-size="18" fill="#8b949e">~/alandssl</text>
      <rect class="cursor" x="170" y="71" width="10" height="19" fill="#58a6ff"/>
    </g>

    <text class="sans in2" x="62" y="176" font-size="92" font-weight="800" fill="url(#accent)">Alan</text>

    <g class="in3">
      <text class="sans" x="64" y="226" font-size="30" font-weight="600" fill="#e6edf3">Desenvolvedor Back-end</text>
      <text class="mono" x="64" y="268" font-size="17" fill="#8b949e">TypeScript  ·  Node.js  ·  Java  ·  Spring Boot  ·  AWS</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#30363d"/>
</svg>
